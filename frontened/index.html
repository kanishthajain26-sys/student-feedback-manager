<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Student Feedback Manager</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

 

  <header class="header">

    <div>
      <h1>Student Feedback Manager</h1>

      <p>
        Manage and analyze student feedback easily
      </p>
    </div>

  </header>


  <main class="container">



    <section class="dashboard">

      <div class="stat-card">

        <span class="stat-title">
          Total Feedbacks
        </span>

        <h2 id="totalFeedback">
          0
        </h2>

      </div>


      <div class="stat-card">

        <span class="stat-title">
          Average Rating
        </span>

        <h2 id="averageRating">
          0 ⭐
        </h2>

      </div>


      <div class="stat-card">

        <span class="stat-title">
          5 Star Feedbacks
        </span>

        <h2 id="fiveStarCount">
          0
        </h2>

      </div>

    </section>


    <section class="panel">

      <h2>Rating Overview</h2>

      <div id="ratingOverview">

      </div>

    </section>


   

    <section class="panel">

      <h2 id="formTitle">
        Submit Feedback
      </h2>


      <form id="feedbackForm">

        <div class="form-grid">


          <div class="form-group">

            <label>
              Student Name
            </label>

            <input
              type="text"
              id="name"
              placeholder="Enter student name"
              required
            >

          </div>


          <div class="form-group">

            <label>
              Course
            </label>

            <select id="course" required>

              <option value="">
                Select Course
              </option>

              <option value="Web Development">
                Web Development
              </option>

              <option value="JavaScript">
                JavaScript
              </option>

              <option value="React">
                React
              </option>

              <option value="MongoDB">
                MongoDB
              </option>

              <option value="Node.js">
                Node.js
              </option>

            </select>

          </div>


        </div>


        <div class="form-group">

          <label>
            Rating
          </label>

          <select id="rating" required>

            <option value="">
              Select Rating
            </option>

            <option value="1">
              1 - Poor
            </option>

            <option value="2">
              2 - Fair
            </option>

            <option value="3">
              3 - Good
            </option>

            <option value="4">
              4 - Very Good
            </option>

            <option value="5">
              5 - Excellent
            </option>

          </select>

        </div>


        <div class="form-group">

          <label>
            Feedback
          </label>

          <textarea
            id="comment"
            rows="5"
            placeholder="Write your feedback..."
            required
          ></textarea>

        </div>


        <div class="form-buttons">

          <button
            type="submit"
            id="submitBtn"
          >
            Submit Feedback
          </button>


          <button
            type="button"
            id="cancelBtn"
            class="secondary-btn hidden"
          >
            Cancel Edit
          </button>

        </div>

      </form>

    </section>


  <section class="panel">

      <div class="feedback-header">

        <div>

          <h2>
            Student Feedbacks
          </h2>

          <p class="small-text">
            Search, filter and manage feedback
          </p>

        </div>


        <button
          id="refreshBtn"
          class="secondary-btn"
        >
          Refresh
        </button>

      </div>

      <div class="filters">

        <input
          type="text"
          id="searchInput"
          placeholder="Search by name or feedback..."
        >


        <select id="ratingFilter">

          <option value="all">
            All Ratings
          </option>

          <option value="5">
            5 Stars
          </option>

          <option value="4">
            4 Stars
          </option>

          <option value="3">
            3 Stars
          </option>

          <option value="2">
            2 Stars
          </option>

          <option value="1">
            1 Star
          </option>

        </select>


        <select id="courseFilter">

          <option value="all">
            All Courses
          </option>

          <option value="Web Development">
            Web Development
          </option>

          <option value="JavaScript">
            JavaScript
          </option>

          <option value="React">
            React
          </option>

          <option value="MongoDB">
            MongoDB
          </option>

          <option value="Node.js">
            Node.js
          </option>

        </select>

      </div>


      <div id="message"></div>


      <div id="feedbackList">

      </div>

    </section>


  </main>


  <script src="script.js"></script>

</body>

</html>
